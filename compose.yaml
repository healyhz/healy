services:
  db:
    image: postgres:18-alpine
    env_file: .env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: .dockerfile
    env_file: .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  landing:
    build:
      context: ./landing
      dockerfile: .dockerfile
    env_file: .env
    depends_on:
      - backend

  frontend:
    profiles: [prod]
    build:
      context: ./frontend
      dockerfile: .dockerfile
    env_file: .env
    depends_on:
      - backend

  proxy:
    profiles: [prod]
    image: nginx:stable-alpine
    ports:
      - '80:80'
    volumes:
      - ./proxy.nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - landing
