services:
  db:
    image: postgres:18-alpine
    env_file: .env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: .dockerfile
    ports:
      - '8000:3000'
    env_file: .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  landing:
    build:
      context: ./landing
      dockerfile: .dockerfile
    ports:
      - '8080:80'
    env_file: .env
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: .dockerfile
    ports:
      - '80:80'
    env_file: .env
    depends_on:
      - backend
