services:
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  backend:
    build:
      context: ./backend
      dockerfile: .dockerfile
    ports:
      - '8000:3000'
    environment:
      - ENV=${ENV}
      - APP_URL=${APP_URL}
      - API_URL=${API_URL}
      - LANDING_URL=${LANDING_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db

  landing:
    build:
      context: ./landing
      dockerfile: .dockerfile
    ports:
      - '8080:80'
    environment:
      - APP_URL=${APP_URL}
    depends_on:
      - backend

  frontend:
    profiles:
      - PROD
    build:
      context: ./frontend
      dockerfile: .dockerfile
    ports:
      - '80:80'
    depends_on:
      - backend
