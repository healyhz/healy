server {
    listen 80;
    server_name healy.ru app.healy.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name healy.ru;

    ssl_certificate /etc/letsencrypt/live/healy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/healy.ru/privkey.pem;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://landing:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name app.healy.ru;

    ssl_certificate /etc/letsencrypt/live/healy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/healy.ru/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
